<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IService - Conversa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .logo h1 {
            font-size: 24px;
            color: #2d3436;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header .logo h1 i {
            color: #4cb951;
        }

        header nav ul {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        header nav ul li a {
            color: #636e72;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        header nav ul li a:hover {
            color: #4cb951;
        }

        .chat-wrapper {
            flex: 1;
            max-width: 860px;
            margin: 30px auto;
            width: 100%;
            padding: 0 20px;
        }

        .chat-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 600px;
            border: 1px solid #e8ecf0;
        }

        .chat-header {
            background: #ffffff;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #e8ecf0;
        }

        .chat-header .back-btn {
            color: #636e72;
            text-decoration: none;
            font-size: 18px;
            transition: 0.2s;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f5f7fa;
        }

        .chat-header .back-btn:hover {
            background: #e8ecf0;
            color: #2d3436;
        }

        .chat-header .chat-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .chat-header .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #4cb951;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
        }

        .chat-header .chat-nome {
            color: #2d3436;
            font-weight: 600;
            font-size: 16px;
        }

        .chat-header .chat-status {
            color: #b2bec3;
            font-size: 13px;
            font-weight: 400;
        }

        .chat-header .chat-status i {
            color: #4cb951;
            font-size: 10px;
            margin-right: 6px;
        }

        .chat-messages {
            flex: 1;
            padding: 24px 24px;
            overflow-y: auto;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f3f5;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #d0d5dd;
            border-radius: 4px;
        }

        .mensagem {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .mensagem.enviada {
            background: #4cb951;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .mensagem.recebida {
            background: #ffffff;
            color: #2d3436;
            align-self: flex-start;
            border: 1px solid #e8ecf0;
            border-bottom-left-radius: 4px;
        }

        .mensagem .hora {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 4px;
            display: block;
            text-align: right;
        }

        .mensagem.enviada .hora {
            color: rgba(255,255,255,0.7);
        }

        .mensagem.recebida .hora {
            color: #b2bec3;
        }

        .sem-mensagens {
            text-align: center;
            color: #b2bec3;
            padding: 50px 0;
            font-size: 15px;
        }

        .sem-mensagens i {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
            color: #dce1e8;
        }

        .chat-footer {
            padding: 16px 20px;
            background: #ffffff;
            border-top: 1px solid #e8ecf0;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-footer input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e8ecf0;
            border-radius: 30px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background: #f8fafc;
            transition: 0.2s;
        }

        .chat-footer input:focus {
            border-color: #4cb951;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(76, 185, 81, 0.08);
        }

        .chat-footer input::placeholder {
            color: #b2bec3;
        }

        .chat-footer button {
            padding: 12px 28px;
            background: #4cb951;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-footer button:hover {
            background: #43a047;
            transform: scale(1.02);
        }

        .chat-footer button i {
            font-size: 14px;
        }

        footer {
            background: #ffffff;
            border-top: 1px solid #e8ecf0;
            padding: 20px 0;
            text-align: center;
            color: #b2bec3;
            font-size: 14px;
            margin-top: auto;
        }

        @media (max-width: 600px) {
            .chat-wrapper {
                margin: 12px auto;
                padding: 0 12px;
            }

            .chat-card {
                height: 85vh;
                border-radius: 16px;
            }

            .chat-header {
                padding: 12px 16px;
            }

            .chat-header .chat-nome {
                font-size: 14px;
            }

            .chat-messages {
                padding: 16px;
            }

            .mensagem {
                max-width: 85%;
                font-size: 14px;
                padding: 8px 14px;
            }

            .chat-footer {
                padding: 12px 16px;
                gap: 8px;
            }

            .chat-footer input {
                font-size: 14px;
                padding: 10px 14px;
            }

            .chat-footer button {
                padding: 10px 18px;
                font-size: 14px;
            }

            header .container {
                padding: 0 16px;
            }

            header nav ul {
                gap: 16px;
            }

            header nav ul li a {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">
                <h1><i class="fas fa-handshake"></i> IService</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="dashboard-cliente.html">Dashboard</a></li>
                    <li><a href="profissionais.html">Serviços</a></li>
                    <li><a href="login.html">Sair</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="chat-wrapper">
        <div class="chat-card">
            <div class="chat-header">
                <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <div class="chat-info">
                    <div class="chat-avatar" id="chatAvatar">P</div>
                    <div>
                        <div class="chat-nome" id="chatNome">Prestador</div>
                        <div class="chat-status"><i class="fas fa-circle"></i> Online</div>
                    </div>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="sem-mensagens">
                    <i class="fas fa-comment-dots"></i>
                    Nenhuma mensagem ainda.<br>Envie uma mensagem para iniciar a conversa.
                </div>
            </div>

            <div class="chat-footer">
                <input type="text" id="mensagemInput" placeholder="Digite sua mensagem..." />
                <button id="btnEnviar"><i class="fas fa-paper-plane"></i> Enviar</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 IService - Taquara/RS</p>
        </div>
    </footer>

    <script>
        const token = localStorage.getItem('token');
        const usuario = JSON.parse(localStorage.getItem('usuario'));

        if (!token || !usuario) {
            window.location.href = 'login.html';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chatId');

        if (!chatId) {
            document.getElementById('chatMessages').innerHTML = '<p style="text-align:center;color:#e74c3c;padding:40px 0;">Chat não identificado</p>';
        }

        const messagesContainer = document.getElementById('chatMessages');
        const inputMensagem = document.getElementById('mensagemInput');
        const btnEnviar = document.getElementById('btnEnviar');
        const chatNome = document.getElementById('chatNome');
        const chatAvatar = document.getElementById('chatAvatar');

        async function carregarChat() {
            try {
                const resposta = await fetch(`http://localhost:3000/api/chat/${chatId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    messagesContainer.innerHTML = `<p style="text-align:center;color:#e74c3c;padding:40px 0;">${dados.mensagem || 'Erro ao carregar mensagens'}</p>`;
                    return;
                }

                if (dados.chat && dados.chat.participants) {
                    const outro = dados.chat.participants.find(p => p._id !== usuario.id);
                    if (outro) {
                        chatNome.textContent = outro.nome || 'Prestador';
                        chatAvatar.textContent = (outro.nome || 'P')[0].toUpperCase();
                    }
                }

                const messages = dados.messages || [];

                if (messages.length === 0) {
                    messagesContainer.innerHTML = `
                        <div class="sem-mensagens">
                            <i class="fas fa-comment-dots"></i>
                            Nenhuma mensagem ainda.<br>Envie uma mensagem para iniciar a conversa.
                        </div>
                    `;
                    return;
                }

                messagesContainer.innerHTML = messages.map(msg => {
                    const isEnviada = msg.sender === usuario.id;
                    const hora = new Date(msg.createdAt || msg.data_envio || Date.now());
                    const horaStr = hora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                    return `
                        <div class="mensagem ${isEnviada ? 'enviada' : 'recebida'}">
                            ${msg.content}
                            <span class="hora">${horaStr}</span>
                        </div>
                    `;
                }).join('');

                messagesContainer.scrollTop = messagesContainer.scrollHeight;

            } catch (erro) {
                messagesContainer.innerHTML = '<p style="text-align:center;color:#e74c3c;padding:40px 0;">Erro ao conectar com o servidor</p>';
            }
        }

        async function enviarMensagem() {
            const content = inputMensagem.value.trim();
            if (!content) return;

            const btnOriginal = btnEnviar.innerHTML;
            btnEnviar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
            btnEnviar.disabled = true;

            try {
                const resposta = await fetch('http://localhost:3000/api/chat/message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ chat_id: chatId, content })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    alert(dados.mensagem || 'Erro ao enviar mensagem');
                    return;
                }

                inputMensagem.value = '';
                carregarChat();

            } catch (erro) {
                alert('Erro ao conectar com o servidor');
            } finally {
                btnEnviar.innerHTML = btnOriginal;
                btnEnviar.disabled = false;
            }
        }

        btnEnviar.addEventListener('click', enviarMensagem);

        inputMensagem.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                enviarMensagem();
            }
        });

        carregarChat();
        setInterval(carregarChat, 5000);
    </script>

</body>
</html>
