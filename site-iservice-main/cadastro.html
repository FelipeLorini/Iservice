<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IService - Criar Conta</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .cadastro-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        }

        .cadastro-container h2 {
            text-align: center;
            color: #4cb951;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #4cb951;
            outline: none;
        }

        .tipo-cadastro {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .tipo-btn {
            flex: 1;
            padding: 15px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 16px;
            color: #666;
        }

        .tipo-btn i {
            display: block;
            font-size: 30px;
            margin-bottom: 8px;
            color: #999;
        }

        .tipo-btn.active {
            background: #e8f5e9;
            border-color: #4cb951;
            color: #4cb951;
        }

        .tipo-btn.active i {
            color: #4cb951;
        }

        .prestador-fields {
            display: none;
        }

        .prestador-fields.show {
            display: block;
        }

        .btn-cadastrar {
            width: 100%;
            padding: 14px;
            background: #4cb951;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-cadastrar:hover {
            background: #43a047;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #4cb951;
            text-decoration: none;
        }

        .msg-status {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">
                <h1>IService</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="cadastro-container">
        <h2><i class="fas fa-user-plus"></i> Criar Conta</h2>

        <div class="tipo-cadastro">
            <div class="tipo-btn active" data-tipo="cliente">
                <i class="fas fa-home"></i>
                Cliente
            </div>
            <div class="tipo-btn" data-tipo="prestador">
                <i class="fas fa-tools"></i>
                Prestador
            </div>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" required placeholder="Seu nome">
            </div>

            <div class="form-group">
                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="registerSenha">Senha</label>
                <input type="password" id="registerSenha" required placeholder="Mínimo 6 caracteres">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" required placeholder="(11) 99999-9999">
            </div>

            <div class="prestador-fields" id="prestadorFields">
                <div class="form-group">
                    <label for="especialidade">Especialidade</label>
                    <select id="especialidade">
                        <option value="faxina">Faxina</option>
                        <option value="jardinagem">Jardinagem</option>
                        <option value="reparos">Reparos</option>
                        <option value="eletrica">Elétrica</option>
                        <option value="pintura">Pintura</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição do serviço</label>
                    <input type="text" id="descricao" placeholder="Ex: Faxina completa, organizo casas...">
                </div>
            </div>

            <button type="submit" class="btn-cadastrar">Criar Conta</button>
        </form>

        <p id="msgCadastro" class="msg-status"></p>

        <div class="login-link">
            <p>Já tem conta? <a href="login.html">Faça login</a></p>
        </div>
    </div>

    <script>
        document.querySelectorAll('.tipo-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const tipo = this.dataset.tipo;
                const prestadorFields = document.getElementById('prestadorFields');

                if (tipo === 'prestador') {
                    prestadorFields.classList.add('show');
                } else {
                    prestadorFields.classList.remove('show');
                }
            });
        });

        document.getElementById("registerForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const nome = document.getElementById("nome").value;
            const email = document.getElementById("registerEmail").value;
            const senha = document.getElementById("registerSenha").value;
            const telefone = document.getElementById("telefone").value;

            const tipoBtn = document.querySelector('.tipo-btn.active');
            const tipo = tipoBtn ? tipoBtn.dataset.tipo : 'cliente';

            const msg = document.getElementById("msgCadastro");

            msg.textContent = "";
            msg.style.color = "#e74c3c";

            try {
                const resposta = await fetch('http://localhost:3000/api/cadastro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ nome, email, senha, tipo, telefone })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    msg.textContent = dados.mensagem || "Erro ao cadastrar";
                    return;
                }

                msg.style.color = "#4cb951";
                msg.textContent = "Conta criada com sucesso! Redirecionando...";

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);

            } catch (erro) {
                msg.textContent = "Erro ao conectar com o servidor";
            }
        });
    </script>

</body>
</html>
